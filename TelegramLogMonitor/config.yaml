# Telegram Log Monitor - business configuration.
# Single source of truth for which bots are monitored and how their messages are
# classified. Change values here; no code changes are needed. Restart to apply.

bots:
  - username: perimeterlog_bot     # without the leading @
    label: Perimeter Log
    backfill_limit: 200            # messages pulled on first run (later runs resume from the last stored id)
    start_command: /start          # sent once by `python -m app.login` if you have never chatted with the bot
  - username: TTMlogsBot
    label: TTM Logs
    backfill_limit: 200
    start_command: /start

# Severity classification. Levels are evaluated from highest rank down; the first
# level whose pattern matches (case-insensitive regex) wins. Unmatched -> `default`.
severity:
  default: info
  levels:
    - name: critical
      rank: 4
      color: "#d93025"
      patterns: ['\bcritical\b', '\bbreach(ed)?\b', '\bransomware\b', '\bintrusion\b', '\bcompromis(e|ed)\b', '🔴', '🚨']
    - name: high
      rank: 3
      color: "#e8710a"
      patterns: ['\bhigh\b', '\balert\b', '\battack\b', '\bblocked\b', '\bdenied\b', '\bbrute.?force\b', '\bmalware\b']
    - name: medium
      rank: 2
      color: "#f9ab00"
      patterns: ['\bwarn(ing)?\b', '\bmedium\b', '\bsuspicious\b', '\bfailed\b', '\bscan(ning)?\b', '🟠', '⚠']
    - name: low
      rank: 1
      color: "#1a73e8"
      patterns: ['\blow\b', '\bnotice\b']
    - name: info
      rank: 0
      color: "#5f6368"
      patterns: []

# Fields pulled out of message text. Name -> regex; capture group 1 is used if present,
# otherwise the whole match. All unique matches are stored and searchable.
extractors:
  ip: '\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b'
  cve: '\bCVE-\d{4}-\d{4,7}\b'
  port: '\bport[:=\s]+(\d{1,5})\b'
  domain: '\b((?:[a-z0-9-]+\.)+(?:com|net|org|io|in|gov|edu|co|info|biz|xyz))\b'

media:
  download: true          # auto-save files/photos as they arrive
  max_size_mb: 20         # auto-save limit; bigger files are fetched from Telegram when you click Download
  on_demand_max_mb: 500   # largest file the dashboard is allowed to fetch on click
  preview_photos: true    # show photo thumbnails in the feed (other file types are always downloads)

retention:
  days: 90              # delete stored messages older than this; 0 = keep forever
  purge_interval_minutes: 60

# Search command: when a command you send starts with one of `trigger_commands`,
# the dashboard shows the "Choose strings format" selector and plays the intelligence
# sweep animation. The chosen format's `suffix` is appended to the command text that is
# sent to the bot (leave it blank for the bot's own default). Edit freely; no code changes.
search:
  trigger_commands: ['/search', '/lookup', '/osint']
  default_format: plain
  formats:
    - id: plain
      label: Plain text
      suffix: ''
      description: The bot's default output
    - id: json
      label: JSON
      suffix: ' --format=json'
      description: Machine-readable JSON
    - id: csv
      label: CSV
      suffix: ' --format=csv'
      description: Comma-separated values
    - id: list
      label: Line list
      suffix: ' --format=list'
      description: One string per line

ui:
  page_size: 100
  refresh_stats_seconds: 30
