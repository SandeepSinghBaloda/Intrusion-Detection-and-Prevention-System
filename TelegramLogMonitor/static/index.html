<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darkweb OSINT Tool</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1l7 7-7 7-7-7z%22 fill=%22%232563eb%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg class="scanner" viewBox="0 0 48 48" width="40" height="40" role="img" aria-label="scanning">
          <defs>
            <radialGradient id="scan-fade" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="currentColor" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle class="ring" cx="24" cy="24" r="21"/>
          <circle class="ring" cx="24" cy="24" r="14"/>
          <circle class="ring" cx="24" cy="24" r="7"/>
          <line class="cross" x1="24" y1="3" x2="24" y2="45"/>
          <line class="cross" x1="3" y1="24" x2="45" y2="24"/>
          <g class="sweep"><path d="M24 24 L24 3 A21 21 0 0 1 42 14 Z" fill="url(#scan-fade)"/></g>
          <circle class="blip" cx="33" cy="17" r="1.8"/>
          <circle class="core" cx="24" cy="24" r="2.4"/>
        </svg>
      </span>
      <div>
        <h1>Darkweb OSINT Tool</h1>
      </div>
    </div>
    <div class="status">
      <span class="pill health" id="health-pill" title="Server health">
        <span class="hb"></span><span class="txt">Healthy</span>
      </span>
      <span class="pill" id="collector-pill">server: …</span>
      <span class="pill" id="live-pill"><span class="dot"></span>live</span>
    </div>
  </header>

  <div class="banner" id="error-banner" hidden></div>

  <main>
    <section class="kpis" id="kpis" aria-label="Summary"></section>

    <section class="card activity" aria-label="Activity last 24 hours">
      <div class="card-head"><h2>Activity · last 24h</h2><span class="muted" id="activity-range"></span></div>
      <div class="bars" id="bars"></div>
    </section>

    <section class="card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" id="tab-feed" aria-selected="true">Feed</button>
        <button type="button" role="tab" class="tab" id="tab-files" aria-selected="false">Files <span class="badge" id="files-badge"></span></button>
      </div>
      <div class="filters">
        <select id="f-bot" aria-label="Bot"><option value="">All bots</option></select>
        <div class="chips" id="f-sev" role="group" aria-label="Severity"></div>
        <input id="f-q" type="search" placeholder="Search text, IP, CVE…" aria-label="Search">
        <label class="check"><input type="checkbox" id="f-out" checked> show my commands</label>
        <label class="check"><input type="checkbox" id="f-pause"> pause live</label>
      </div>
      <div class="toolbar">
        <div class="muted count" id="count"></div>
        <div class="cleanup">
          <label class="muted small" for="del-age">Remove</label>
          <select id="del-age" aria-label="Remove older than">
            <option value="">all shown</option>
            <option value="1">older than 1 day</option>
            <option value="7">older than 7 days</option>
            <option value="30">older than 30 days</option>
            <option value="90">older than 90 days</option>
          </select>
          <button type="button" class="danger" id="del-btn">Delete</button>
        </div>
      </div>
      <ol class="feed" id="feed"></ol>
      <p class="empty muted" id="empty" hidden>Nothing here yet.</p>
      <button class="more" id="more" hidden>Load more</button>
    </section>

    <section class="card">
      <div class="card-head"><h2>Send command to bot</h2></div>
      <form class="send" id="send-form">
        <div class="server-select">
          <select id="s-bot" aria-label="Target bot"></select>
          <span class="server-live" id="server-live" title="Server status">
            <i class="led"></i><span class="txt">LIVE</span>
          </span>
        </div>
        <input id="s-text" placeholder="/search &lt;query&gt;, /status, /logs …" autocomplete="off" required maxlength="4096">
        <button type="submit">Send</button>
      </form>
      <div class="send-opts" id="search-opts" hidden>
        <label for="s-format">Choose strings format</label>
        <select id="s-format" aria-label="Strings format"></select>
        <span class="muted small" id="s-format-hint"></span>
      </div>

      <div class="scan" id="scan" hidden aria-live="polite">
        <div class="scan-grid"></div>
        <div class="scan-line"></div>
        <div class="scan-body">
          <div class="scan-radar"><span></span><span></span><span></span></div>
          <div class="scan-text">
            <div class="scan-title">Running darkweb intelligence sweep…</div>
            <ul class="scan-steps" id="scan-steps"></ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <template id="msg-tpl">
    <li class="msg">
      <div class="meta">
        <time></time>
        <span class="bot"></span>
        <span class="sev"></span>
        <span class="edited muted" hidden>edited</span>
      </div>
      <pre class="text"></pre>
      <div class="extras"></div>
    </li>
  </template>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
